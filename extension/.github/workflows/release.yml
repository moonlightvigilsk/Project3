name: Release

# Push a tag equal to package.json "version" (1.0.0 or v1.0.0): tests, store zips, GitHub release.
# Uploading to the Chrome Web Store / Edge Add-ons stays manual (store/listing.md).

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The manifest version comes from package.json: a tag that does not match would publish
      # a zip with another version than the release name.
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Builds the Chrome extension, then runs the end-to-end tests on it (US-13).
      - name: E2E tests
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # wxt zip: .output/textchecker-<version>-chrome.zip (Chrome Web Store and Edge Add-ons),
      # .output/textchecker-<version>-firefox.zip and the sources zip Firefox Add-ons asks for.
      - name: Create store zips
        run: |
          npm run zip
          npm run zip:firefox
          ls -l .output/*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TextChecker ${{ env.VERSION }}
          body: |
            ## TextChecker ${{ env.VERSION }}

            Learn French from the pages you read: word lookup (Wiktionary), vocabulary notebook,
            grammar analysis of a sentence, grammar cards and practice sentences.
            Grammar features use the project's backend (`backend/`, default http://127.0.0.1:8000).

            ### Install from the zip

            **Chrome / Edge / Brave**
            1. Download `textchecker-${{ env.VERSION }}-chrome.zip` and extract it.
            2. Open `chrome://extensions/` (Edge: `edge://extensions/`) and turn on Developer mode.
            3. Click "Load unpacked" and choose the extracted folder.

            **Firefox** (temporary install)
            1. Download `textchecker-${{ env.VERSION }}-firefox.zip`.
            2. Open `about:debugging#/runtime/this-firefox`, click "Load Temporary Add-on" and choose the zip.

            Privacy policy: [PRIVACY.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/PRIVACY.md)
          files: |
            .output/textchecker-${{ env.VERSION }}-chrome.zip
            .output/textchecker-${{ env.VERSION }}-firefox.zip
            .output/textchecker-${{ env.VERSION }}-sources.zip
          draft: false
          prerelease: false
          generate_release_notes: true
