[project]
name = "language-learning-tool-backend"
version = "0.1.0"
description = "FastAPI backend for the French language learning tool"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "spacy>=3.8.0,<4.0.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    # spaCy French model (not published on PyPI)
    "fr-core-news-md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
]

[tool.uv]
package = false
